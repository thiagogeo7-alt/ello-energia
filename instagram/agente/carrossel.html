<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:"Archivo",sans-serif;overflow:hidden}
.slide{width:1080px;height:1350px;padding:110px 96px 96px;display:flex;flex-direction:column;position:relative}
.escuro{background:#0A1A33;color:#fff}
.claro{background:#fff;color:#0A1A33}
.ambar{background:#F5A524;color:#0A1A33}
.marca{display:flex;align-items:center;gap:18px;font-variation-settings:"wdth" 125;font-weight:900;font-size:40px;letter-spacing:.02em}
.marca svg{width:56px;height:56px}
.num{position:absolute;top:118px;right:96px;font-size:30px;font-weight:700;opacity:.55}
h1{font-variation-settings:"wdth" 125;font-weight:800;line-height:1.02;letter-spacing:-.02em;margin-top:auto}
.capa h1{font-size:118px}
.conteudo h1{font-size:88px;margin-top:220px}
.conteudo p{font-size:50px}
.final h1{font-size:96px}
p{font-size:44px;line-height:1.35;margin-top:44px;max-width:860px}
.escuro p{color:#C9D5E6}
.claro p{color:#4A5A72}
.barra{width:120px;height:12px;background:#F5A524;margin-top:56px}
.claro .barra{background:#2F5BEA}
.rodape{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:32px;font-weight:600}
.cta{background:#1FAF5B;color:#fff;border-radius:18px;padding:30px 40px;font-size:40px;font-weight:800;margin-top:56px;align-self:flex-start}
.seta{font-size:34px;font-weight:700;opacity:.7}
</style>
</head>
<body>
<div class="slide {{classe}}">
  <div class="marca"><svg viewBox="9 9 30 30" fill="none"><path d="M14 24c0-6 4-10 10-10s10 4 10 10-4 10-10 10M34 24c0-6-4-10-10-10s-10 4-10 10 4 10 10 10" stroke="{{cor_logo}}" stroke-width="4.5" stroke-linecap="round"/></svg>ELLO</div>
  <div class="num">{{n}}/{{total}}</div>
  <h1>{{titulo}}</h1>
  <div class="barra"></div>
  <p>{{texto}}</p>
  {{cta}}
  <div class="rodape"><span>Energia solar compartilhada · Campinas</span><span class="seta">{{seta}}</span></div>
</div>
</body>
</html>
