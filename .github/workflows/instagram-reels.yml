name: Instagram - Reels com vídeo IA (~15 por mês)

on:
  schedule:
    # Várias tentativas (17h47 às 22h47 de Brasília); nucleo/lista.py só deixa publicar em dia previsto e uma vez por dia
    - cron: "47 20,21,22,23 * * *"
    - cron: "47 0,1 * * *"
  workflow_dispatch:
    inputs:
      cliente:
        description: "Cliente (nome da pasta em clientes/; todos = todos os ligados)"
        type: string
        default: ello
      simular:
        description: "Simular (não publica nem gasta)"
        type: boolean
        default: true
      tema:
        description: "Tema obrigatório (opcional)"
        type: string
        default: ""
      formato:
        description: "Formato (automático = rodízio)"
        type: choice
        options: [automatico, dialogo, explicativo, reacao]
        default: automatico
      previa:
        description: "Só gerar a prévia do vídeo (não publica)"
        type: boolean
        default: false

permissions:
  contents: write


jobs:
  clientes:
    # Agendamentos só rodam depois que a variável AGENTE_ATIVO = sim for criada no GitHub
    if: github.event_name == 'workflow_dispatch' || vars.AGENTE_ATIVO == 'sim'
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.lista.outputs.lista }}
    steps:
      - uses: actions/checkout@v4
      - id: lista
        run: pip install -q pyyaml && python nucleo/lista.py instagram "${{ github.event_name == 'schedule' && 'todos' || inputs.cliente }}" >> "$GITHUB_OUTPUT"

  rodar:
    needs: clientes
    if: needs.clientes.outputs.lista != '[]'
    name: ${{ matrix.cliente }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.clientes.outputs.lista) }}
    concurrency:
      group: agente-instagram-${{ matrix.cliente }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: instagram
    steps:
      - uses: actions/checkout@v4

      - name: Baixar os dados do agente (branch do cliente)
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          git clone -q --depth 20 --branch "${{ matrix.dados }}" "$URL" dados 2>/dev/null || {
            mkdir -p dados && cd dados && git init -q && git checkout -q -b "${{ matrix.dados }}" && git remote add origin "$URL"; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: instagram/requirements.txt

      - run: pip install -r requirements.txt

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: python -m playwright install --with-deps chromium

      - name: Executar
        env:
          SIMULAR: ${{ (inputs.simular && !inputs.previa) && '1' || '0' }}
          PREVIA: ${{ inputs.previa && '1' || '0' }}
          FORMATO: ${{ inputs.formato != 'automatico' && inputs.formato || '' }}
          DADOS_DIR: ${{ github.workspace }}/instagram/dados
          GITHUB_TOKEN: ${{ github.token }}
          TEMA: ${{ inputs.tema }}
          CLIENTE: ${{ matrix.cliente }}
          SEGREDOS_JSON: ${{ toJSON(secrets) }}
          VARIAVEIS_JSON: ${{ toJSON(vars) }}
        run: python -m agente reels

      - name: Guardar a prévia do vídeo (branch "previa")
        if: inputs.previa
        working-directory: instagram/previa
        run: |
          git init -q -b previa
          git config user.name "ello-bot"; git config user.email "ello-bot@users.noreply.github.com"
          git add -A && git commit -qm "Prévia ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" previa:${{ matrix.previa }}${{ inputs.formato }}
