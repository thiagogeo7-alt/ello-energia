name: Instagram - Reels com vídeo IA (~15 por mês)

on:
  schedule:
    - cron: "0 21 */2 * *"   # dias ímpares, 18h de Brasília
  workflow_dispatch:
    inputs:
      simular:
        description: "Simular (não publica nem gasta)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: agente-instagram
  cancel-in-progress: false

jobs:
  rodar:
    # Agendamentos só rodam depois que a variável AGENTE_ATIVO = sim for criada no GitHub
    if: github.event_name == 'workflow_dispatch' || vars.AGENTE_ATIVO == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: instagram
    steps:
      - uses: actions/checkout@v4

      - name: Baixar os dados do agente (branch "dados")
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          git clone -q --depth 20 --branch dados "$URL" dados 2>/dev/null || {
            mkdir -p dados && cd dados && git init -q && git checkout -q -b dados && git remote add origin "$URL"; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: instagram/requirements.txt

      - run: pip install -r requirements.txt

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: python -m playwright install --with-deps chromium

      - name: Executar
        env:
          SIMULAR: ${{ inputs.simular && '1' || '0' }}
          DADOS_DIR: ${{ github.workspace }}/instagram/dados
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          MODO_CENA: ${{ vars.MODO_CENA }}
        run: python -m agente reels
