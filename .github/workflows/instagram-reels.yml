name: Instagram - Reels com vídeo IA (dias ímpares, ~15 por mês)

on:
  schedule:
    # Várias tentativas (17h47 às 22h47 de Brasília); o verificador só publica em dia ímpar e uma vez por dia
    - cron: "47 20,21,22,23 * * *"
    - cron: "47 0,1 * * *"
  workflow_dispatch:
    inputs:
      simular:
        description: "Simular (não publica nem gasta)"
        type: boolean
        default: true
      tema:
        description: "Tema obrigatório (opcional)"
        type: string
        default: ""
      formato:
        description: "Formato (automático = rodízio)"
        type: choice
        options: [automatico, dialogo, explicativo, reacao]
        default: automatico
      previa:
        description: "Só gerar a prévia do vídeo (não publica)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: agente-instagram
  cancel-in-progress: false

jobs:
  verificar:
    # Execuções agendadas: o GitHub às vezes pula horários, então tentamos várias vezes no dia
    # e este passo garante que só a primeira tentativa que der certo publica.
    if: github.event_name == 'schedule' && vars.AGENTE_ATIVO == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rodar: ${{ steps.decisao.outputs.rodar }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: instagram/agenda.py
          sparse-checkout-cone-mode: false
      - id: decisao
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          git clone -q --depth 1 --branch dados "$URL" dados 2>/dev/null || mkdir -p dados
          python3 instagram/agenda.py reels dados/estado.json >> "$GITHUB_OUTPUT"

  rodar:
    needs: verificar
    # Manual: roda sempre. Agendado: só quando o verificador mandar publicar.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.verificar.outputs.rodar == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: instagram
    steps:
      - uses: actions/checkout@v5

      - name: Baixar os dados do agente (branch "dados")
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          git clone -q --depth 20 --branch dados "$URL" dados 2>/dev/null || {
            mkdir -p dados && cd dados && git init -q && git checkout -q -b dados && git remote add origin "$URL"; }

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: instagram/requirements.txt

      - run: pip install -r requirements.txt

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: python -m playwright install --with-deps chromium

      - name: Executar
        env:
          SIMULAR: ${{ (inputs.simular && !inputs.previa) && '1' || '0' }}
          PREVIA: ${{ inputs.previa && '1' || '0' }}
          FORMATO: ${{ inputs.formato != 'automatico' && inputs.formato || '' }}
          DADOS_DIR: ${{ github.workspace }}/instagram/dados
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          MODO_CENA: ${{ vars.MODO_CENA }}
          PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
          TEMA: ${{ inputs.tema }}
        run: python -m agente reels

      - name: Guardar a prévia do vídeo (branch "previa")
        if: inputs.previa
        working-directory: instagram/previa
        run: |
          git init -q -b previa
          git config user.name "ello-bot"; git config user.email "ello-bot@users.noreply.github.com"
          git add -A && git commit -qm "Prévia ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" previa:previa-${{ inputs.formato }}

      - name: Avisar a equipe por e-mail se falhar
        if: failure()
        working-directory: .
        env:
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          EMAIL_REMETENTE: ${{ vars.EMAIL_REMETENTE }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          ALERTA_EMAIL: ${{ vars.ALERTA_EMAIL }}
        run: >-
          python3 scripts/alerta.py "Falhou: ${{ github.workflow }}"
          "A execução falhou. Detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
