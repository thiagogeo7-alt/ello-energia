name: Instagram - Carrossel (terça e quinta)

on:
  schedule:
    # Várias tentativas (12h13 às 17h13 de Brasília) às terças e quintas; publica uma vez por dia
    - cron: "13 15,16,17,18,19,20 * * 2,4"
  workflow_dispatch:
    inputs:
      agendado:
        description: "Uso do Despertador: só publica se for dia e ainda não houver publicação hoje"
        type: boolean
        default: false
      simular:
        description: "Simular (não publica nem gasta)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: agente-instagram
  cancel-in-progress: false

jobs:
  verificar:
    # Execuções agendadas: o GitHub às vezes pula horários, então tentamos várias vezes no dia
    # e este passo garante que só a primeira tentativa que der certo publica.
    if: (github.event_name == 'schedule' || inputs.agendado) && vars.AGENTE_ATIVO == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rodar: ${{ steps.decisao.outputs.rodar }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: instagram/agenda.py
          sparse-checkout-cone-mode: false
      - id: decisao
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          git clone -q --depth 1 --branch dados "$URL" dados 2>/dev/null || mkdir -p dados
          python3 instagram/agenda.py carrossel dados/estado.json >> "$GITHUB_OUTPUT"

  rodar:
    needs: verificar
    # Manual: roda sempre. Agendado: só quando o verificador mandar publicar.
    if: always() && ((github.event_name == 'workflow_dispatch' && !inputs.agendado) || needs.verificar.outputs.rodar == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: instagram
    steps:
      - uses: actions/checkout@v5

      - name: Baixar os dados do agente (branch "dados")
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          git clone -q --depth 20 --branch dados "$URL" dados 2>/dev/null || {
            mkdir -p dados && cd dados && git init -q && git checkout -q -b dados && git remote add origin "$URL"; }

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: instagram/requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m playwright install --with-deps chromium

      - name: Executar
        env:
          SIMULAR: ${{ inputs.simular && '1' || '0' }}
          DADOS_DIR: ${{ github.workspace }}/instagram/dados
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          MODO_CENA: ${{ vars.MODO_CENA }}
          PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
        run: python -m agente carrossel

      - name: Avisar a equipe por e-mail se falhar
        if: failure()
        working-directory: .
        env:
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          EMAIL_REMETENTE: ${{ vars.EMAIL_REMETENTE }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          ALERTA_EMAIL: ${{ vars.ALERTA_EMAIL }}
        run: >-
          python3 scripts/alerta.py "Falhou: ${{ github.workflow }}"
          "A execução falhou. Detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
