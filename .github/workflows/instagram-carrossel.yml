name: Instagram - Carrossel (terça e quinta)

on:
  schedule:
    # Várias tentativas (12h13 às 17h13 de Brasília) às terças e quintas; publica uma vez por dia
    - cron: "13 15,16,17,18,19,20 * * 2,4"
  workflow_dispatch:
    inputs:
      cliente:
        description: "Cliente (nome da pasta em clientes/; todos = todos os ligados)"
        type: string
        default: ello
      simular:
        description: "Simular (não publica nem gasta)"
        type: boolean
        default: true

permissions:
  contents: write


jobs:
  clientes:
    # Agendamentos só rodam depois que a variável AGENTE_ATIVO = sim for criada no GitHub
    if: github.event_name == 'workflow_dispatch' || vars.AGENTE_ATIVO == 'sim'
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.lista.outputs.lista }}
    steps:
      - uses: actions/checkout@v4
      - id: lista
        run: pip install -q pyyaml && python nucleo/lista.py instagram "${{ github.event_name == 'schedule' && 'todos' || inputs.cliente }}" carrossel >> "$GITHUB_OUTPUT"

  rodar:
    needs: clientes
    if: needs.clientes.outputs.lista != '[]'
    name: ${{ matrix.cliente }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.clientes.outputs.lista) }}
    concurrency:
      group: agente-instagram-${{ matrix.cliente }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: instagram
    steps:
      - uses: actions/checkout@v4

      - name: Baixar os dados do agente (branch do cliente)
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          git clone -q --depth 20 --branch "${{ matrix.dados }}" "$URL" dados 2>/dev/null || {
            mkdir -p dados && cd dados && git init -q && git checkout -q -b "${{ matrix.dados }}" && git remote add origin "$URL"; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: instagram/requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m playwright install --with-deps chromium

      - name: Executar
        env:
          SIMULAR: ${{ inputs.simular && '1' || '0' }}
          DADOS_DIR: ${{ github.workspace }}/instagram/dados
          GITHUB_TOKEN: ${{ github.token }}
          CLIENTE: ${{ matrix.cliente }}
          SEGREDOS_JSON: ${{ toJSON(secrets) }}
          VARIAVEIS_JSON: ${{ toJSON(vars) }}
        run: python -m agente carrossel
