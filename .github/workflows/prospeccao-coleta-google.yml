name: Prospecção - Coletar contatos (Google, toda segunda)

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      cliente:
        description: "Cliente (nome da pasta em clientes/; todos = todos os ligados)"
        type: string
        default: ello
      simular:
        description: "Simular (não envia e-mails nem gasta cota)"
        type: boolean
        default: true

permissions:
  contents: write


jobs:
  clientes:
    if: github.event_name == 'workflow_dispatch' || vars.PROSPECCAO_COLETA == 'sim'
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.lista.outputs.lista }}
    steps:
      - uses: actions/checkout@v4
      - id: lista
        run: pip install -q pyyaml && python nucleo/lista.py prospeccao "${{ github.event_name == 'schedule' && 'todos' || inputs.cliente }}" >> "$GITHUB_OUTPUT"

  rodar:
    needs: clientes
    if: needs.clientes.outputs.lista != '[]'
    name: ${{ matrix.cliente }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.clientes.outputs.lista) }}
    concurrency:
      group: prospeccao-${{ matrix.cliente }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: prospeccao
    steps:
      - uses: actions/checkout@v4

      - name: Baixar os dados da prospecção
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: git clone -q --depth 1 --branch "${{ matrix.prospeccao }}" "$URL" dados/prospeccao 2>/dev/null || mkdir -p dados/prospeccao

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prospeccao/requirements.txt

      - run: pip install -r requirements.txt

      - name: Executar
        env:
          SIMULAR: ${{ inputs.simular && '1' || '0' }}
          DADOS_DIR: ${{ github.workspace }}/prospeccao/dados
          GITHUB_TOKEN: ${{ github.token }}
          CLIENTE: ${{ matrix.cliente }}
          SEGREDOS_JSON: ${{ toJSON(secrets) }}
          VARIAVEIS_JSON: ${{ toJSON(vars) }}
        run: python -m agente coletar-google
