name: Instagram - Relatório semanal de estratégia

on:
  schedule:
    # Reserva: segunda 8h20 de Brasília (o Despertador normalmente dispara às 8h)
    - cron: "20 11 * * 1"
  workflow_dispatch:
    inputs:
      agendado:
        description: "Uso do Despertador: não repete se o relatório da semana já saiu"
        type: boolean
        default: false
      simular:
        description: "Simular (não envia o e-mail nem gasta)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: agente-instagram
  cancel-in-progress: false

jobs:
  rodar:
    # Agendamentos só rodam depois que a variável AGENTE_ATIVO = sim for criada no GitHub
    if: github.event_name == 'workflow_dispatch' || vars.AGENTE_ATIVO == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: instagram
    steps:
      - uses: actions/checkout@v5

      - name: Baixar os dados do agente (branch "dados")
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          git clone -q --depth 20 --branch dados "$URL" dados 2>/dev/null || {
            mkdir -p dados && cd dados && git init -q && git checkout -q -b dados && git remote add origin "$URL"; }

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: instagram/requirements.txt

      - run: pip install -r requirements.txt

      - name: Executar
        env:
          SIMULAR: ${{ inputs.simular && '1' || '0' }}
          AGENDADO: ${{ (github.event_name == 'schedule' || inputs.agendado) && '1' || '0' }}
          DADOS_DIR: ${{ github.workspace }}/instagram/dados
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          MODO_CENA: ${{ vars.MODO_CENA }}
          PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          EMAIL_REMETENTE: ${{ vars.EMAIL_REMETENTE }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          ALERTA_EMAIL: ${{ vars.ALERTA_EMAIL }}
        run: python -m agente relatorio

      - name: Avisar a equipe por e-mail se falhar
        if: failure()
        working-directory: .
        env:
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          EMAIL_REMETENTE: ${{ vars.EMAIL_REMETENTE }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          ALERTA_EMAIL: ${{ vars.ALERTA_EMAIL }}
        run: >-
          python3 scripts/alerta.py "Falhou: ${{ github.workflow }}"
          "A execução falhou. Detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
