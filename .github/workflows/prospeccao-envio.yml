name: Prospecção - Enviar e-mails (dias úteis, 9h e 14h)

on:
  schedule:
    - cron: "0 12 * * 1-5"
    - cron: "0 17 * * 1-5"
  workflow_dispatch:
    inputs:
      simular:
        description: "Simular (não envia e-mails nem gasta cota)"
        type: boolean
        default: true
      previa:
        description: "Só mostrar a prévia dos e-mails (não envia nada)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: prospeccao
  cancel-in-progress: false

jobs:
  rodar:
    if: github.event_name == 'workflow_dispatch' || vars.PROSPECCAO_ATIVA == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prospeccao
    steps:
      - uses: actions/checkout@v5

      - name: Baixar os dados da prospecção
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: git clone -q --depth 1 --branch prospeccao-dados "$URL" dados/prospeccao 2>/dev/null || mkdir -p dados/prospeccao

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prospeccao/requirements.txt

      - run: pip install -r requirements.txt

      - name: Executar
        env:
          SIMULAR: ${{ (inputs.simular && !inputs.previa) && '1' || '0' }}
          DADOS_DIR: ${{ github.workspace }}/prospeccao/dados
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          EMAIL_REMETENTE: ${{ vars.EMAIL_REMETENTE }}
          NOME_REMETENTE: ${{ vars.NOME_REMETENTE }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          IMAP_HOST: ${{ vars.IMAP_HOST }}
          LINK_AGENDA: ${{ vars.LINK_AGENDA }}
          LINK_SITE: ${{ vars.LINK_SITE }}
          RODAPE_EMPRESA: ${{ vars.RODAPE_EMPRESA }}
          LIMITE_DIA: ${{ vars.LIMITE_DIA }}
          ASSUNTO_EMAIL: ${{ vars.ASSUNTO_EMAIL }}
        run: python -m agente ${{ inputs.previa && 'previa' || 'enviar' }}

      - name: Avisar a equipe por e-mail se falhar
        if: failure()
        working-directory: .
        env:
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          EMAIL_REMETENTE: ${{ vars.EMAIL_REMETENTE }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          ALERTA_EMAIL: ${{ vars.ALERTA_EMAIL }}
        run: >-
          python3 scripts/alerta.py "Falhou: ${{ github.workflow }}"
          "A execução falhou. Detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
